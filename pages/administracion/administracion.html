<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gestiona la información, las fotografías, la carta y las promociones de tu restaurante en MesaSpot."
    />
    <meta name="theme-color" content="#c95830" />
    <title>Mi restaurante · MesaSpot</title>
    <link
      rel="icon"
      href="https://res.cloudinary.com/dtsfiwmzt/image/upload/v1793637908/MesaSpot_awonrz.ico"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="../../styles/auth.css" />
    <link rel="stylesheet" href="../../styles/integration.css" />
    <link rel="stylesheet" href="../../styles/admin-panel.css" />
    <link rel="stylesheet" href="../../styles/admin-promociones.css" />
    <link rel="stylesheet" href="../../styles/admin-locales.css" />
    <link rel="stylesheet" href="../../styles/admin-resenas.css" />
    <link rel="stylesheet" href="../../styles/admin-reservas.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
    ></script>
    <script defer src="../../vendor/lucide-1.61.0.min.js"></script>
    <script defer src="../../js/icons.js"></script>
    <script defer src="../../js/config.js"></script>
    <script defer src="../../js/api.js"></script>
    <script defer src="../../js/ui.js"></script>
    <script defer src="../../js/app.js"></script>
    <script defer src="../../js/auth.js"></script>
    <script defer src="../../js/admin-componentes.js"></script>
    <script defer src="../../js/admin-restaurante.js"></script>
    <script defer src="../../js/admin-locales.js"></script>
    <script defer src="../../js/admin-resenas.js"></script>
    <script defer src="../../js/admin-reservas.js"></script>
    <script defer src="../../js/admin-fotos.js"></script>
    <script defer src="../../js/admin-platos.js"></script>
    <script defer src="../../js/admin-promociones.js"></script>
    <script defer src="../../js/admin.js"></script>
    <script defer src="../../js/admin-panel.js"></script>
  </head>
  <body class="owner-page" data-page="admin-owner">
    <a class="skip-link" href="#owner-content">Saltar al contenido</a>
    <div class="owner-mobile-bar">
      <a class="brand" href="../../index.html">MesaSpot</a>
      <button
        id="owner-menu"
        class="owner-icon"
        type="button"
        aria-label="Abrir menú administrativo"
        aria-expanded="false"
        aria-controls="owner-sidebar"
      >
        <i data-lucide="menu"></i>
      </button>
    </div>
    <button
      id="owner-backdrop"
      class="owner-backdrop"
      type="button"
      aria-label="Cerrar menú"
      hidden
    ></button>
    <aside
      class="owner-sidebar"
      id="owner-sidebar"
      aria-label="Panel del restaurante"
    >
      <a class="brand owner-brand" href="../../index.html"
        ><span class="brand-icon"
          ><img
            src="https://res.cloudinary.com/dtsfiwmzt/image/upload/v1793635050/Logo_sin_fondo_d4ibca.png"
            alt=""
            width="42"
            height="42" /></span
        >MesaSpot</a
      >
      <div id="owner-selector" class="owner-selector"></div>
      <nav
        id="owner-navigation"
        class="owner-navigation"
        aria-label="Administración"
      ></nav>
      <div id="owner-account" class="owner-account"></div>
    </aside>
    <main id="owner-content" class="owner-content" tabindex="-1">
      <div id="owner-screen" aria-busy="true">
        <p class="owner-loading" role="status">Preparando tu restaurante…</p>
      </div>
      <section id="owner-legacy" hidden>
        <div class="owner-heading">
          <div>
            <p class="owner-eyebrow">Herramientas del restaurante</p>
            <h1>Gestión administrativa</h1>
          </div>
          <a class="owner-button secondary" href="administracion.html"
            >Volver a mi restaurante</a
          >
        </div>
        <div id="admin-workspace" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <button
        class="modal-close icon-button"
        id="close-modal"
        aria-label="Cerrar ventana"
        type="button"
      >
        <i data-lucide="x"></i>
      </button>
      <div id="modal-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
